<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="写小工具，装好就能用">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f6fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="0.55" stop-color="#8250df"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.15" fill="#59636e" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect x="520" width="680" height="320" fill="url(#dots)"/>

  <!-- 左侧：身份 + 钩子 -->
  <text x="56" y="102" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="14" font-weight="600" letter-spacing="4" fill="#59636e">XKZM123</text>
  <rect x="56" y="120" width="46" height="4" rx="2" fill="url(#accent)"/>
  <text x="56" y="184" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="48" font-weight="700" fill="#1f2328">写小工具，装好就能用</text>
  <text x="56" y="230" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="17" fill="#59636e">DeepSeek Harness 插件 · 零依赖 · 中文文档优先</text>

  <!-- 右侧：终端卡片 -->
  <rect x="700" y="64" width="444" height="192" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="730" cy="92" r="6" fill="#ff5f56"/>
  <circle cx="754" cy="92" r="6" fill="#ffbd2e"/>
  <circle cx="778" cy="92" r="6" fill="#27c93f"/>
  <line x1="700" y1="112" x2="1144" y2="112" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="728" y="150" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace"
        font-size="15" fill="#1f2328"><tspan fill="#1a7f37">$</tspan> dsh plugin add dsh-browser-bridge</text>
  <text x="728" y="182" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace"
        font-size="15" fill="#59636e"><tspan fill="#1a7f37">✓</tspan> 装好了，去点那个按钮吧</text>
  <text x="728" y="214" font-family="'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace"
        font-size="15" fill="#818b98"># 零依赖 · 不联网 · 不上传</text>
